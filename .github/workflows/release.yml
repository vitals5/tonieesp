name: Release

on:
  release:
    types: [published]

jobs:
  release:
    name: Package HACS Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Package zip for HACS
        run: |
          cd custom_components/tonieesp
          zip -r ../../tonieesp.zip .

      - name: Upload zip to Release
        uses: softprops/action-gh-release@v2
        with:
          files: tonieesp.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
