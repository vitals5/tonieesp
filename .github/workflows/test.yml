name: Tests and Quality Checks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontend:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Typecheck
        working-directory: ./frontend
        run: npm run typecheck

      - name: Build frontend bundle
        working-directory: ./frontend
        run: npm run build

  backend:
    name: Python Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv pip install --system pytest pytest-asyncio pytest-cov ruff homeassistant

      - name: Lint with Ruff
        run: |
          ruff check custom_components/tonieesp tests
          ruff format --check custom_components/tonieesp tests

      - name: Run Pytest
        run: |
          pytest tests -v --cov=custom_components.tonieesp
